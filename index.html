<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ular Tangga Metamorfosis</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1e293b;
    }
    body {
      margin: 0;
      color: var(--ink);
      font-family: Nunito, sans-serif;
    }
    .game-font { font-family: Fredoka, sans-serif; }
    .cloud-bg {
      background: linear-gradient(180deg, #80dcf5 0%, #c8f3ff 60%, #fff3bc 100%);
    }
    .landing-art { animation: float 3s ease-in-out infinite; }
    .landing-art:nth-child(2) { animation-delay: .25s; }
    .landing-art:nth-child(3) { animation-delay: .5s; }
    .landing-art:nth-child(4) { animation-delay: .75s; }
    .landing-art:nth-child(5) { animation-delay: 1s; }
    @keyframes float {
      50% { transform: translateY(-12px) rotate(4deg); }
    }
    .btn-pop {
      transition: all .15s ease;
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    }
    .btn-pop:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .btn-pop:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.15); }
  </style>
</head>
<body class="cloud-bg min-h-screen flex items-center justify-center p-4">

  <main class="w-full max-w-2xl text-center">
    <!-- Emotikon Atas -->
    <div class="mb-4 flex justify-center gap-4 text-5xl sm:text-6xl" aria-hidden="true">
      <span class="landing-art">🐍</span>
      <span class="landing-art">🪜</span>
      <span class="landing-art">🦋</span>
      <span class="landing-art">🐸</span>
      <span class="landing-art">🦟</span>
    </div>

    <!-- Kartu Utama -->
    <div class="rounded-[32px] border-4 border-white bg-white/95 p-6 sm:p-10 shadow-2xl backdrop-blur-sm">
      <p class="game-font font-extrabold tracking-wider text-sky-700 text-sm sm:text-base uppercase mb-1">
        Petualangan Sains
      </p>
      
      <h1 class="game-font text-3xl sm:text-4xl font-extrabold text-slate-800 leading-tight">
        Ular Tangga Metamorfosis
      </h1>
      
      <p class="game-font text-base sm:text-lg font-bold text-slate-600 mt-2">
        Belajar Daur Hidup Hewan Sambil Bermain!
      </p>

      <!-- Form Input -->
      <form id="start-form" onsubmit="event.preventDefault();" class="mx-auto mt-6 max-w-md text-left">
        <label for="player-name" class="block font-extrabold text-slate-700 text-sm mb-2">
          Nama Pemain:
        </label>
        
        <input 
          id="player-name" 
          type="text" 
          placeholder="Masukkan nama kamu di sini..." 
          class="w-full rounded-2xl border-3 border-sky-400 bg-slate-50 px-5 py-3.5 text-base font-bold text-slate-800 placeholder-slate-400 outline-none focus:border-sky-500 focus:bg-white focus:ring-4 focus:ring-amber-300 transition-all shadow-inner"
          maxlength="30"
        >
        
        <button 
          type="submit" 
          class="btn-pop mt-4 w-full rounded-2xl bg-amber-400 hover:bg-amber-300 px-6 py-4 font-extrabold text-slate-900 text-lg tracking-wide border-2 border-amber-200"
        >
          🚀 Mulai Permainan
        </button>
      </form>

      <!-- Instruksi Singkat -->
      <p class="mx-auto mt-6 max-w-lg rounded-2xl bg-sky-50 border border-sky-100 p-3.5 text-xs sm:text-sm font-bold text-slate-600 leading-relaxed">
        Jawab pertanyaan metamorfosis di tiap petak untuk naik tangga dan hindari gigitan ular!
      </p>

      <!-- Tombol Bawah -->
      <div class="mt-6 flex flex-wrap justify-center gap-3">
        <button type="button" class="btn-pop rounded-xl bg-sky-100 hover:bg-sky-200 px-5 py-2.5 font-extrabold text-sky-800 text-sm border border-sky-200">
          📘 Panduan Game
        </button>
        <button type="button" class="btn-pop rounded-xl bg-purple-100 hover:bg-purple-200 px-5 py-2.5 font-extrabold text-purple-800 text-sm border border-purple-200">
          🏆 Papan Skor
        </button>
      </div>
    </div>
  </main>

</body>
</html>
