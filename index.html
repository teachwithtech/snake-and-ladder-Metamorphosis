  <style>
    :root {
      /* Mengubah --ink ke warna biru sangat gelap agar teks kontras */
      --ink: #1b3142;
      --sky: #80dcf5;
      --cream: #fffdf2;
      --orange: #ff9d68;
      --green: #7bcf58;
      --yellow: #ffe36c;
      --purple: #d9c7ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      overflow-x: hidden;
      color: var(--ink);
      font-family: Nunito, sans-serif;
    }

    button, input { 
      font: inherit; 
      color: var(--ink); /* Memastikan warna teks input & tombol tebal/gelap */
    }
    
    button:focus-visible, input:focus-visible {
      outline: 4px solid #ffe36c;
      outline-offset: 3px;
    }

    .game-font { font-family: Fredoka, sans-serif; }

    .screen {
      display: none;
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
    }

    .screen.active { display: flex; }

    .cloud-bg {
      background-color: #9ee8fb;
      background-image:
        radial-gradient(circle at 12% 14%, rgba(255,255,255,.9) 0 38px, transparent 40px),
        radial-gradient(circle at 88% 8%, rgba(255,255,255,.85) 0 55px, transparent 57px),
        linear-gradient(180deg, #80dcf5 0%, #c8f3ff 60%, #fff3bc 100%);
    }

    .landing-art { animation: float 3s ease-in-out infinite; }
    .landing-art:nth-child(2) { animation-delay: .25s; }
    .landing-art:nth-child(3) { animation-delay: .5s; }
    .landing-art:nth-child(4) { animation-delay: .75s; }
    .landing-art:nth-child(5) { animation-delay: 1s; }

    @keyframes float {
      50% { transform: translateY(-12px) rotate(4deg); }
    }

    .board-wrap {
      position: relative;
      width: min(100%, 760px);
      aspect-ratio: 1;
      overflow: hidden;
      border: 11px solid #fff;
      border-radius: 25px;
      background: #fff;
      box-shadow: 0 12px 0 #79b9c6, 0 20px 34px rgba(31,91,109,.25);
    }

    .board-grid {
      display: grid;
      width: 100%;
      height: 100%;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(10, 1fr);
    }

    .cell {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border: 1px solid rgba(35,92,105,.18);
    }

    .cell:nth-child(5n + 1) { background: #ffef82; }
    .cell:nth-child(5n + 2) { background: #b4eb91; }
    .cell:nth-child(5n + 3) { background: #a3e6fa; }
    .cell:nth-child(5n + 4) { background: #ffc0d9; }
    .cell:nth-child(5n) { background: #d7c2ff; }

    .cell-num {
      position: absolute;
      top: 3px;
      left: 5px;
      color: #0f2d37; /* Dipergelap agar jelas dibaca di petak */
      font: 800 clamp(10px, 1.7vw, 19px) Fredoka, sans-serif;
      text-shadow: 1px 1px 0px #fff;
    }

    .cell-deco {
      position: absolute;
      right: 4px;
      bottom: 1px;
      opacity: .6;
      font-size: clamp(8px, 1.5vw, 16px);
    }

    .board-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .pawn {
      position: absolute;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 9%;
      height: 9%;
      pointer-events: none;
      font-size: clamp(21px, 4vw, 42px);
      filter: drop-shadow(0 4px 2px rgba(34,70,80,.35));
      transition: left .25s ease, top .25s ease;
    }

    .pawn.moving {
      animation: pawn-bounce .28s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 8px #fff500);
    }

    @keyframes pawn-bounce {
      to { transform: translateY(-9px) scale(1.12); }
    }

    .control-card {
      border: 4px solid #fff;
      border-radius: 24px;
      background: rgba(255,255,255,.93);
      box-shadow: 0 8px 0 rgba(52,144,160,.27);
    }

    .dice {
      display: grid;
      width: 92px;
      height: 92px;
      place-items: center;
      border: 5px solid #fff;
      border-radius: 20px;
      background: linear-gradient(145deg, #fff, #e7fbff);
      box-shadow: 0 8px 0 #51b8cf;
      color: #ff754d;
      font: 700 55px Fredoka, sans-serif;
    }

    .dice.rolling { animation: roll .7s linear infinite; }

    @keyframes roll {
      to { transform: rotate(360deg) scale(.86); }
    }

    .btn-pop {
      transition: transform .15s, filter .15s, box-shadow .15s;
      box-shadow: 0 5px 0 rgba(47,83,102,.25);
    }

    .btn-pop:hover { transform: translateY(-2px); filter: brightness(1.04); }
    .btn-pop:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(47,83,102,.25); }
    .btn-pop:disabled { cursor: not-allowed; opacity: .55; transform: none; }

    .modal-layer {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(25,72,94,.55);
      backdrop-filter: blur(3px);
    }

    .modal-layer.show { display: flex; }

    .modal-card {
      width: min(100%, 650px);
      max-height: 90%;
      overflow: auto;
      border: 6px solid #fff;
      border-radius: 29px;
      box-shadow: 0 15px 0 rgba(20,74,98,.2);
      color: #1b3142;
    }

    .answer-option {
      width: 100%;
      padding: 13px 16px;
      border: 3px solid #d8eff5;
      border-radius: 16px;
      background: #fff;
      text-align: left;
      font-weight: 800;
      color: #1b3142;
      transition: .16s;
    }

    .answer-option:hover,
    .answer-option:focus-visible {
      border-color: #4fc0dd;
      background: #edfbff;
      transform: translateX(3px);
    }

    .answer-option.correct { border-color: #62b844; background: #c9f5b6; color: #16420b; }
    .answer-option.wrong { border-color: #ef668e; background: #ffd1df; color: #5c0920; }

    .toast {
      position: fixed;
      top: 18px;
      left: 50%;
      z-index: 50;
      width: min(90%, 470px);
      padding: 14px 18px;
      border: 4px solid #fff;
      border-radius: 18px;
      text-align: center;
      font-weight: 800;
      color: #1b3142;
      box-shadow: 0 8px 0 rgba(38,99,120,.2);
      transform: translate(-50%, -150px);
      transition: transform .35s ease;
    }

    .toast.show { transform: translate(-50%, 0); }

    .table-wrap { overflow: auto; }

    .score-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .88rem;
      color: #1b3142;
    }

    .score-table th, .score-table td {
      padding: 10px;
      border-bottom: 1px solid #d7edf2;
      text-align: left;
      vertical-align: top;
    }

    .score-table th {
      position: sticky;
      top: 0;
      background: #e8fbff;
      color: #0f2d37;
    }

    .confetti {
      position: absolute;
      top: -20px;
      width: 100px;
      height: 14px;
      animation: fall 2.7s linear forwards;
    }

    @keyframes fall {
      to {
        opacity: 0;
        transform: translate(var(--drift), calc(100 * min(var(--vh, 1vh), 1vh))) rotate(720deg);
      }
    }

    .hidden { display: none !important; }

    @media (max-width: 700px) {
      .board-wrap {
        border-width: 6px;
        border-radius: 16px;
        box-shadow: 0 7px 0 #79b9c6;
      }

      .control-card { border-radius: 18px; }
      .dice { width: 70px; height: 70px; font-size: 42px; }
      .cell-num { top: 1px; left: 3px; }
      .pawn { font-size: clamp(16px, 7vw, 31px); }
    }
  </style>
 </head>
